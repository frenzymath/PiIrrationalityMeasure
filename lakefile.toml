name = "formalization"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Formalization", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Formalization"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
